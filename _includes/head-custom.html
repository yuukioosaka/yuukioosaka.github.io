<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
  (function() {
    function render() {
      if (!window.mermaid) return;
      mermaid.initialize({ startOnLoad: false });
      var blocks = document.querySelectorAll('pre code.language-mermaid, div.mermaid');
      if (blocks.length === 0) return;
      blocks.forEach(function(block) {
        var pre = block.closest('pre');
        if (pre) {
          var src = block.textContent;
          mermaid.render('mmd' + Math.random().toString(36).slice(2), src).then(function(res) {
            var div = document.createElement('div');
            div.className = 'mermaid';
            div.innerHTML = res.svg;
            pre.parentNode.replaceChild(div, pre);
          });
        }
      });
    }
    function boot() {
      setTimeout(render, 0);
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  })();
</script>
