# 記事生成に不要なツール行を無効化する。
# dsh の patch は行の config をまるごと置き換えるため、必須キーも再掲する。
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'
  disabled: true
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
  disabled: true
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'
  disabled: true
- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  disabled: true
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
- id: tool-subagent-fork
  name: '@deepseek-ai/dsh-tool-subagent'
  disabled: true
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot
- id: tool-subagent-list-agents
  name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
  disabled: true
- id: tool-workflow
  name: '@deepseek-ai/dsh-tool-workflow'
  disabled: true
# 検索は Tavily（keyless は無料 / API キーがあれば月1,000クレジット無料枠）を使う。
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: tavily
    fetchProvider: http
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    search: true
    fetch: true
# メモリコンパクション（会話の自動圧縮）。推論トークンを抑えるため早めに圧縮する。
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    auto: true
    thresholdRatio: 0.25
    headroomTokens: 65536
    retainRatio: 0.04
    compactionRetries: 1
    maxOverflowRetries: 1
    modelPolicies: []
