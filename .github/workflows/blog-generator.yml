name: Auto News Digest Generator

on:
  # 毎日 JST 7:00（UTC 22:00）に自動実行
  schedule:
    - cron: '0 22 * * *'
  # 手動実行のトリガー（任意でテーマ・特記を追加可能）
  workflow_dispatch:
    inputs:
      note:
        description: '記事作成への追加指示（任意）'
        required: false
        default: ''

jobs:
  build-blog:
    runs-on: ubuntu-latest

    # Environment secrets（キー名: DEEPSEEK_API_KEY）を参照するための環境宣言
    environment: key

    # リポジトリへの書き込み（git push）に必要な最小権限を明示
    # （デフォルトの Read では push が失敗します）
    permissions:
      contents: write

    steps:
      # 1. コードのチェックアウト
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Node.js 22のセットアップ（OpenClawはNode 22以上を推奨。
      #    ubuntu-latest のデフォルトNodeに依存せず明示的に固定）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. OpenClawのグローバルインストール
      - name: Install OpenClaw
        run: |
          npm install -g openclaw@latest
          echo "OpenClaw installed successfully."

      # 4. DeepSeek (OpenAI互換) プロバイダーを登録した設定を生成
      #    apiKey は SecretRef（env）指定で、実行時環境変数 DEEPSEEK_API_KEY から
      #    解決されるため、設定ファイルやログに実キーが露出しません。
      - name: Configure DeepSeek provider
        run: |
          mkdir -p ~/.openclaw
          cat << 'EOF' > ~/.openclaw/openclaw.json
          {
            "models": {
              "mode": "merge",
              "providers": {
                "deepseek": {
                  "baseUrl": "https://api.deepseek.com",
                  "apiKey": {
                    "source": "env",
                    "provider": "default",
                    "id": "DEEPSEEK_API_KEY"
                  },
                  "auth": "api-key",
                  "api": "openai-completions"
                }
              }
            }
          }
          EOF
          echo "DeepSeek プロバイダー設定を作成しました。"

      # 5. 当日日付を取得し、prompt.mdの「yyyy-MM-dd」を当日日付へ置換
      - name: Prepare prompt with today's date
        run: |
          TODAY=$(date +%F)
          echo "TODAY=${TODAY}" >> "$GITHUB_ENV"
          mkdir -p _posts
          # prompt.md内の「yyyy-MM-dd」を当日日付に置換して一時プロンプトを作成
          sed "s/yyyy-MM-dd/${TODAY}/g" prompt.md > generated-prompt.md
          echo "generated-prompt.md を作成しました。"

      # 6. OpenClawエージェントによるブログ生成プロンプトの実行
      #    openclaw agent --local で埋め込み実行し、--json で受け取った
      #    最終メッセージ（記事全文）を抽出して _posts/yyyy-MM-dd-news.md に保存します。
      - name: Run OpenClaw Agent
        env:
          TODAY: ${{ env.TODAY }}
          EXTRA_NOTE: ${{ github.event.inputs.note || '' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          # prompt.mdから置換済みのプロンプトを読み込み、追加指示があれば付与
          cp generated-prompt.md run-prompt.md
          if [ -n "$EXTRA_NOTE" ]; then
            printf '以下の追加指示にも従ってください。\n%s\n\n' "$EXTRA_NOTE" > run-prompt.md
            cat generated-prompt.md >> run-prompt.md
          fi

          # 記事保存の手順をプロンプト末尾に追記
          cat >> run-prompt.md << PROMPTEOF

          以下の手順に従ってください：
          1. 上記の指示に基づき、組み込みの検索ツールで当日のニュース・市場データをリサーチしてください。
          2. 記事冒頭にはJekyllのフロントマター（layout: post / title / date: ${TODAY} 00:00:00 +0900 / excerpt）を付与してください。
          3. 完成したMarkdown記事の全文を最終メッセージとして返してください（ファイル保存ではなく返答の全文を出力）。
          PROMPTEOF

          # エージェント実行。--json で stdout をJSONエンベロープ専用にし、
          # ログが記事に混ざるのを防止。JSONから最終メッセージを抽出して保存。
          openclaw agent --local --session-key "news-${TODAY}" \
            --message-file run-prompt.md \
            --model deepseek/deepseek-chat \
            --timeout 900 --json \
            > agent-result.json 2>agent-result.err || {
              echo "Error: OpenClaw agent 実行に失敗しました。" >&2
              cat agent-result.err >&2
              exit 1
            }

          # JSON から記事全文（final または payloads[0].text）を抽出
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("agent-result.json", "utf8"));
            const text = data.final || (data.payloads && data.payloads[0] && data.payloads[0].text) || "";
            if (!text) {
              console.error("Error: 記事テキストがレスポンスに含まれていません。");
              process.exit(1);
            }
            fs.writeFileSync(process.argv[1], text.trim() + "\n");
          ' "_posts/${TODAY}-news.md"

          rm -f generated-prompt.md run-prompt.md agent-result.json agent-result.err

          # 生成結果の検証（フロントマターが含まれているか）
          if ! head -n 1 "_posts/${TODAY}-news.md" | grep -q '^---$'; then
            echo "Error: 記事が正しく生成されませんでした。" >&2
            exit 1
          fi

      # 7. 生成された記事をGitHubに自動コミット & プッシュ
      - name: Commit and Push Generated Blog
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

          FILE="_posts/${TODAY}-news.md"
          if [ -f "$FILE" ]; then
            git add "$FILE"
            git commit -m "docs: auto-generate news digest (${TODAY}) by OpenClaw"
            git push
          else
            echo "Error: ${FILE} が生成されませんでした。"
            exit 1
          fi
