name: Auto News Digest Generator

on:
  # 毎日 JST 7:00（UTC 22:00）に自動実行
  schedule:
    - cron: '0 22 * * *'
  # 手動実行のトリガー（任意でテーマ・特記を追加可能）
  workflow_dispatch:
    inputs:
      note:
        description: '記事作成への追加指示（任意）'
        required: false
        default: ''

jobs:
  build-blog:
    runs-on: ubuntu-latest

    # Environment secrets（キー名: DEEPSEEK_API_KEY）を参照するための環境宣言
    environment: key

    # リポジトリへの書き込み（git push）に必要な最小権限を明示
    # （デフォルトの Read では push が失敗します）
    permissions:
      contents: write

    steps:
      # 1. コードのチェックアウト
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Node.js 22のセットアップ（OpenClawはNode 22以上を推奨。
      #    ubuntu-latest のデフォルトNodeに依存せず明示的に固定）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. OpenClawのグローバルインストール
      - name: Install OpenClaw
        run: |
          npm install -g openclaw@latest
          echo "OpenClaw installed successfully."

      # 4. DeepSeek (OpenAI互換) プロバイダーと Web検索を登録した設定を生成
      #    apiKey は SecretRef（env）指定で、実行時環境変数 DEEPSEEK_API_KEY から
      #    解決されるため、設定ファイルやログに実キーが露出しません。
      #    web.search を有効化し、ヘッドレスな検索ツールでニュースを収集します。
      - name: Configure OpenClaw
        run: |
          mkdir -p ~/.openclaw
          cat << 'EOF' > ~/.openclaw/openclaw.json
          {
            "models": {
              "mode": "merge",
              "providers": {
                "deepseek": {
                  "baseUrl": "https://api.deepseek.com",
                  "apiKey": {
                    "source": "env",
                    "provider": "default",
                    "id": "DEEPSEEK_API_KEY"
                  },
                  "auth": "api-key",
                  "api": "openai-completions"
                }
              }
            },
            "tools": {
              "web": {
                "search": {
                  "enabled": true
                }
              }
            }
          }
          EOF
          echo "OpenClaw 設定を作成しました。"

      # 5a. 現在時刻をJSTで取得し、当日日付を設定
      - name: Prepare today's date
        run: |
          TODAY=$(date +%F)
          echo "TODAY=${TODAY}" >> "$GITHUB_ENV"
          echo "TODAY=${TODAY}"

      # 5b. Python のセットアップと、指標取得に必要な依存ライブラリのインストール
      - name: Setup Python & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pandas beautifulsoup4 curl_cffi requests
          python --version
          pip show yfinance | head -n 2

      # 5c. fetch_indicators.py を実行し、当日の全指標を market_summary.md として生成
      - name: Run indicator fetcher
        run: |
          python fetch_indicators.py
          echo "--- generated market_summary.md ---"
          cat market_summary.md

      # 5d. prompt.md の「yyyy-MM-dd」を当日日付へ置換し、取得した指標データ(全文)を付与してプロンプトを作成
      - name: Prepare prompt with today's date & fetched indicators
        run: |
          mkdir -p _posts
          # prompt.md内の「yyyy-MM-dd」を当日日付に置換
          sed "s/yyyy-MM-dd/${TODAY}/g" prompt.md > generated-prompt.md
          # 取得した指標データ全文をプロンプト末尾に追記
          printf '\n\n【参照用：当日に自動取得した市場指標データ（必ずこの数値を使用すること）】\n' >> generated-prompt.md
          cat market_summary.md >> generated-prompt.md
          echo "generated-prompt.md を作成しました（指標データ内包）。"

      # 6. OpenClawエージェントによるブログ生成プロンプトの実行
      #    openclaw agent --local で埋め込み実行し、--json で受け取った
      #    最終メッセージ（記事全文）を抽出して _posts/yyyy-MM-dd-news.md に保存します。
      - name: Run OpenClaw Agent
        env:
          TODAY: ${{ env.TODAY }}
          EXTRA_NOTE: ${{ github.event.inputs.note || '' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          # prompt.mdから置換済みのプロンプトを読み込み、追加指示があれば付与
          cp generated-prompt.md run-prompt.md
          if [ -n "$EXTRA_NOTE" ]; then
            printf '以下の追加指示にも従ってください。\n%s\n\n' "$EXTRA_NOTE" > run-prompt.md
            cat generated-prompt.md >> run-prompt.md
          fi

          # 記事保存の手順をプロンプト末尾に追記
          #   ※heredoc内のバッククォートはシェルのコマンド置換で壊れるため「コードフェンス」表現で回避
          cat >> run-prompt.md << PROMPTEOF

          以下の手順に従ってください：
          1. 上記の指示に基づき、組み込みの検索ツールで当日のニュース・市場データをリサーチしてください。
          2. 記事冒頭にはJekyllのフロントマター（layout: post / title / date: ${TODAY} 00:00:00 +0900 / excerpt）を付与してください。
          3. 完成したMarkdown記事の全文を、コードフェンス（バッククォート3連）で囲まず、説明文や注記を一切付けず、Markdown本文のみを最終メッセージとしてそのまま返してください。冒頭を必ず「---」行で開始してください。
          PROMPTEOF

          # エージェント実行。プレーン出力（stdout）を捕捉
          openclaw agent --local --session-key "news-${TODAY}" \
            --message-file run-prompt.md \
            --model deepseek/deepseek-chat \
            --timeout 900 \
            > agent-result.out 2>agent-result.err || {
              echo "Error: OpenClaw agent 実行に失敗しました。" >&2
              cat agent-result.err >&2
              exit 1
            }

          # 記事は ```markdown ... ``` のコードブロックで囲んで返される場合があるため、
          # ブロック内の front matter から記事本文のみを抽出して保存
          awk '
            /^```markdown/ { inblock=1; next }
            /^```/ { if (inblock) inblock=0; next }
            inblock { print }
          ' agent-result.out > "_posts/${TODAY}-news.md"

          # コードブロックが無くプレーン出力の場合のフォールバック: 最初の「---」以降を抽出
          if [ ! -s "_posts/${TODAY}-news.md" ]; then
            awk 'found { print } /^---$\s*$/ && !found { found=1; print }' agent-result.out > "_posts/${TODAY}-news.md"
          fi

          rm -f generated-prompt.md run-prompt.md agent-result.out agent-result.err

          # 生成ファイルの一時保存（検証NG時の診断用に残す）
          cp "_posts/${TODAY}-news.md" ".news-draft-${TODAY}.md"

      # 7. 記事の質を検証。NG ならコミット/プッシュを行わない
      - name: Validate Article
        id: validate
        run: |
          FILE="_posts/${TODAY}-news.md"
          if [ ! -f "$FILE" ]; then
            echo "Error: ${FILE} が生成されていません。" >&2
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # フロントマター（---で開始）が必須
          head -n 1 "$FILE" | grep -q '^---$' || {
            echo "NG: フロントマターがありません" >&2
            echo "status=low_quality" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # 本文（フロントマター除去後）の文字数と見出しをチェック
          CHARS=$(tail -n +5 "$FILE" | tr -d '[:space:]' | wc -c)
          HEADERS=$(grep -cE '^#{1,3} ' "$FILE" || true)
          echo "記事文字数: ${CHARS}, 見出し数: ${HEADERS}"
          if [ "$CHARS" -lt 500 ] || [ "$HEADERS" -lt 2 ]; then
            echo "NG: 記事が不自然に短い・見出し不足 (char=${CHARS}, headers=${HEADERS})" >&2
            echo "status=low_quality" >> "$GITHUB_OUTPUT"
          else
            echo "OK: 記事は妥当です"
            echo "status=ok" >> "$GITHUB_OUTPUT"
          fi

      # 8. 生成された記事をGitHubに自動コミット & プッシュ（検証OK時のみ）
      - name: Commit and Push Generated Blog
        if: ${{ steps.validate.outputs.status == 'ok' }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

          FILE="_posts/${TODAY}-news.md"
          git add "$FILE"
          git commit -m "docs: auto-generate news digest (${TODAY}) by OpenClaw"
          git push

      # 9. 検証NG時はコミットせず、診断用に記事をアーティファクト保存
      - name: Upload Draft Artifact (for review)
        if: ${{ steps.validate.outputs.status == 'low_quality' }}
        uses: actions/upload-artifact@v4
        with:
          name: news-draft-${{ env.TODAY }}
          path: .news-draft-${{ env.TODAY }}.md

      # 10. 検証NG時の通知（ワークフロー成功率に影響させない・ただし警告を明示）
      - name: Warn on Low Quality
        if: ${{ steps.validate.outputs.status == 'low_quality' }}
        run: |
          echo "::warning::記事の品質が不十分なためコミットをスキップしました。"
          echo "::warning::手動確認用は Actions の『news-draft-${TODAY}』アーティファクトから取得してください。"
