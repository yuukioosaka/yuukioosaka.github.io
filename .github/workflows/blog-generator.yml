          # エージェントが作成/再作成したファイルをすべてステージしてコミット。
          git add -A
          git commit -m "docs: auto-generate monthly review (${TODAY}) by OpenClaw" || echo "Nothing to commit (already committed or no change)."
          git push || echo "Nothing to push."
