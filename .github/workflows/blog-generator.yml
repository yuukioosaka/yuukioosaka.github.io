      - name: Run dsh Agent
        if: ${{ env.skip != 'true' }}
        env:
          TODAY: ${{ env.TODAY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSH_PERMISSION_MODE: danger-full-access
        run: |
          mkdir -p _posts
          sed "s/yyyy-MM-dd/${TODAY}/g" prompt-weekly.md > generated-prompt.md
          timeout 1800 dsh --profile headless \
            --patch .dsh-config/no-thinking.yml \
            --patch .dsh-config/minimal-tools.yml \
            - < generated-prompt.md 2>agent-error.log || {
              echo "Error: dsh weekly agent 実行に失敗しました。" >&2
