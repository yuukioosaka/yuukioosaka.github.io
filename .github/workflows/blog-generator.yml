      - name: Commit and Push Weekly Review
        if: ${{ env.skip != 'true' }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          # エージェントが作成/再作成したファイルをすべてステージしてコミット。
          git add -A
          git commit -m "docs: auto-generate weekly review (${TODAY}) by dsh" || echo "Nothing to commit (already committed or no change)."
          git push || echo "Nothing to push."

  # ============ 月次ブログ（毎月1日 JST） ============
  monthly:
    name: Monthly Market Review
    runs-on: ubuntu-latest
    environment: key
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare today's date (JST)
        env:
