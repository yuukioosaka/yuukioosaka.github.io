name: Auto News Digest Generator

on:
  # GitHub Actions では cron が複数ある場合、いずれかにマッチするとワークフローが
  # 起動し、全ジョブが実行される。ジョブ単位のスケジュール指定はできないため、
  # 各ジョブは冒頭の「実行日判定」で対象日以外をスキップして制御する。
  schedule:
    # 日次：JST 火〜土 6:00 = UTC 月〜金 21:00
    - cron: '0 21 * * 1-5'
    # 週次：JST 土曜 6:00 = UTC 金曜 21:00（上記日に重複するが、曜日判定で制御）
    - cron: '10 21 * * 5'
    # 月次：毎月1日 JST 0:00 = UTC 前月末 15:00。毎日実行しジョブ内で判定。
    - cron: '0 15 * * *'
  # 手動実行のトリガー
  workflow_dispatch:

env:
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

jobs:
  # ============ 日次ブログ ============
  daily:
    name: Daily News Digest
    runs-on: ubuntu-latest
    environment: key
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare today's date (JST)
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%F)
          echo "TODAY=${TODAY}" >> "$GITHUB_ENV"
          echo "TODAY=${TODAY}"

      # 日次は JST 火〜土のみ。判定は JST の曜日（月=1...日=7 → 火..土 = 2..6）。
      - name: Guard for Tue-Sat (JST)
        run: |
          DOW=$(TZ=Asia/Tokyo date +%u)
          if [ "$DOW" -ge 2 ] && [ "$DOW" -le 6 ]; then
            echo "skip=false" >> "$GITHUB_ENV"
          else
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Setup Node.js
        if: ${{ env.skip != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install OpenClaw
        if: ${{ env.skip != 'true' }}
        run: |
          npm install -g openclaw@latest
          echo "OpenClaw installed successfully."
          openclaw plugins install duckduckgo

      - name: Configure OpenClaw
        if: ${{ env.skip != 'true' }}
        run: |
          mkdir -p ~/.openclaw
          cat << 'EOF' > ~/.openclaw/openclaw.json
          {
            "models": {
              "mode": "merge",
              "providers": {
                "deepseek": {
                  "baseUrl": "https://api.deepseek.com",
                  "apiKey": {
                    "source": "env",
                    "provider": "default",
                    "id": "DEEPSEEK_API_KEY"
                  },
                  "auth": "api-key",
                  "api": "openai-completions"
                }
              }
            },
            "tools": {
              "web": {
                "search": {
                  "enabled": true,
                  "provider": "duckduckgo"
                }
              }
            }
          }
          EOF
          echo "OpenClaw 設定を作成しました。"

      - name: Setup Python & dependencies
        if: ${{ env.skip != 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas beautifulsoup4 curl_cffi requests

      - name: Run indicator fetcher
        if: ${{ env.skip != 'true' }}
        run: |
          python fetch_indicators.py
          echo "--- generated market_summary.md ---"
          cat market_summary.md

      - name: Prepare prompt with today's date & fetched indicators
        if: ${{ env.skip != 'true' }}
        run: |
          mkdir -p _posts
          sed "s/yyyy-MM-dd/${TODAY}/g" prompt.md > generated-prompt.md
          printf '\n\n【参照用：当日に自動取得した市場指標データ（必ずこの数値を使用すること）】\n' >> generated-prompt.md
          cat market_summary.md >> generated-prompt.md
          echo "generated-prompt.md を作成しました（指標データ内包）。"

      - name: Run OpenClaw Agent
        if: ${{ env.skip != 'true' }}
        env:
          TODAY: ${{ env.TODAY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          cp generated-prompt.md run-prompt.md
          openclaw agent --local --session-key "news-${TODAY}" \
            --message-file run-prompt.md \
            --model deepseek/deepseek-v4-flash \
            --timeout 900 2>agent-error.log || {
              echo "Error: OpenClaw agent 実行に失敗しました。" >&2
              cat agent-error.log >&2
              rm -f generated-prompt.md run-prompt.md agent-error.log
              exit 1
            }
          rm -f agent-error.log

      - name: Commit and Push Generated Blog
        if: ${{ env.skip != 'true' }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          # エージェントが作成/再作成したファイルをすべてステージしてコミット。
          # 既存ファイルの再生成・複数ファイル生成の両方に対応。
          git add -A
          git commit -m "docs: auto-generate news digest (${TODAY}) by OpenClaw" || echo "Nothing to commit (already committed or no change)."
          git push || echo "Nothing to push."

  # ============ 週次ブログ（毎週土曜 JST = UTC 金曜 22:00） ============
  weekly:
    name: Weekly Market Review
    runs-on: ubuntu-latest
    environment: key
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare today's date (JST)
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%F)
          echo "TODAY=${TODAY}" >> "$GITHUB_ENV"
          echo "TODAY=${TODAY}"

      # 週次は JST 土曜（曜日=6）のみ。それ以外はスキップ。
      - name: Guard for Saturday (JST)
        run: |
          DOW=$(TZ=Asia/Tokyo date +%u)
          if [ "$DOW" -eq 6 ]; then
            echo "skip=false" >> "$GITHUB_ENV"
          else
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Setup Node.js
        if: ${{ env.skip != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install OpenClaw
        if: ${{ env.skip != 'true' }}
        run: |
          npm install -g openclaw@latest
          echo "OpenClaw installed successfully."
          openclaw plugins install duckduckgo

      - name: Configure OpenClaw
        if: ${{ env.skip != 'true' }}
        run: |
          mkdir -p ~/.openclaw
          cat << 'EOF' > ~/.openclaw/openclaw.json
          {
            "models": {
              "mode": "merge",
              "providers": {
                "deepseek": {
                  "baseUrl": "https://api.deepseek.com",
                  "apiKey": {
                    "source": "env",
                    "provider": "default",
                    "id": "DEEPSEEK_API_KEY"
                  },
                  "auth": "api-key",
                  "api": "openai-completions"
                }
              }
            },
            "tools": {
              "web": {
                "search": {
                  "enabled": true,
                  "provider": "duckduckgo"
                }
              }
            }
          }
          EOF
          echo "OpenClaw 設定を作成しました。"

      - name: Run OpenClaw Agent
        if: ${{ env.skip != 'true' }}
        env:
          TODAY: ${{ env.TODAY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          mkdir -p _posts
          sed "s/yyyy-MM-dd/${TODAY}/g" prompt-weekly.md > generated-prompt.md
          openclaw agent --local --session-key "weekly-${TODAY}" \
            --message-file generated-prompt.md \
            --model deepseek/deepseek-v4-flash \
            --timeout 900 2>agent-error.log || {
              echo "Error: OpenClaw weekly agent 実行に失敗しました。" >&2
              cat agent-error.log >&2
              rm -f generated-prompt.md agent-error.log
              exit 1
            }
          rm -f agent-error.log

      - name: Commit and Push Weekly Review
        if: ${{ env.skip != 'true' }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          # エージェントが作成/再作成したファイルをすべてステージしてコミット。
          git add -A
          git commit -m "docs: auto-generate weekly review (${TODAY}) by OpenClaw" || echo "Nothing to commit (already committed or no change)."
          git push || echo "Nothing to push."

  # ============ 月次ブログ（毎月1日 JST） ============
  monthly:
    name: Monthly Market Review
    runs-on: ubuntu-latest
    environment: key
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare today's date (JST)
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%F)
          echo "TODAY=${TODAY}" >> "$GITHUB_ENV"
          echo "TODAY=${TODAY}"

      # 月次は毎月1日（JST）のみ。判定は「JST日付の日 = 01」。
      # それ以外の日はセットアップごとスキップしてリソースを無駄にしない。
      - name: Guard for 1st of month (JST)
        run: |
          DAY=$(TZ=Asia/Tokyo date +%d)
          if [ "$DAY" = "01" ]; then
            echo "skip=false" >> "$GITHUB_ENV"
          else
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Setup Node.js
        if: ${{ env.skip != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install OpenClaw
        if: ${{ env.skip != 'true' }}
        run: |
          npm install -g openclaw@latest
          echo "OpenClaw installed successfully."
          openclaw plugins install duckduckgo

      - name: Configure OpenClaw
        if: ${{ env.skip != 'true' }}
        run: |
          mkdir -p ~/.openclaw
          cat << 'EOF' > ~/.openclaw/openclaw.json
          {
            "models": {
              "mode": "merge",
              "providers": {
                "deepseek": {
                  "baseUrl": "https://api.deepseek.com",
                  "apiKey": {
                    "source": "env",
                    "provider": "default",
                    "id": "DEEPSEEK_API_KEY"
                  },
                  "auth": "api-key",
                  "api": "openai-completions"
                }
              }
            },
            "tools": {
              "web": {
                "search": {
                  "enabled": true,
                  "provider": "duckduckgo"
                }
              }
            }
          }
          EOF
          echo "OpenClaw 設定を作成しました。"

      - name: Run OpenClaw Agent
        if: ${{ env.skip != 'true' }}
        env:
          TODAY: ${{ env.TODAY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          mkdir -p _posts
          sed "s/yyyy-MM-dd/${TODAY}/g" prompt-monthly.md > generated-prompt.md
          openclaw agent --local --session-key "monthly-${TODAY}" \
            --message-file generated-prompt.md \
            --model deepseek/deepseek-v4-flash \
            --timeout 1200 2>agent-error.log || {
              echo "Error: OpenClaw monthly agent 実行に失敗しました。" >&2
              cat agent-error.log >&2
              rm -f generated-prompt.md agent-error.log
              exit 1
            }
          rm -f agent-error.log

      - name: Commit and Push Monthly Review
        if: ${{ env.skip != 'true' }}
        run: |
