name: Auto News Digest Generator

on:
  # GitHub Actions では cron が複数ある場合、いずれかにマッチするとワークフローが
  # 起動し、全ジョブが実行される。ジョブ単位のスケジュール指定はできないため、
  # 各ジョブは冒頭の「実行日判定」で対象日以外をスキップして制御する。
  #schedule:
    # 日次：JST 火〜土 6:00 = UTC 月〜金 21:00
    #- cron: '0 21 * * 1-5'
    # 週次：JST 土曜 6:00 = UTC 金曜 21:00（上記日に重複するが、曜日判定で制御）
    #- cron: '10 21 * * 5'
    # 月次：毎月1日 JST 0:00 = UTC 前月末 15:00。毎日実行しジョブ内で判定。
    #- cron: '20 21 * * *'
  # 手動実行のトリガー（デバッグ用に日付・対象ジョブを指定可能）
  workflow_dispatch:
    inputs:
      date:
        description: '対象日 (YYYY-MM-DD, JST)。空なら今日。デバッグ用。'
        required: false
        default: ''
        type: string
      job:
        description: '実行対象ジョブ'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - daily
          - weekly
          - monthly
      force:
        description: '曜日/日付ガードを無視して実行'
        required: false
        default: false
        type: boolean

env:
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

jobs:
  # ============ 日次ブログ ============
  daily:
    name: Daily News Digest
    runs-on: ubuntu-latest
    environment: key
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare today's date (JST)
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_JOB: ${{ inputs.job }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          if [ -n "${INPUT_DATE}" ]; then
            TODAY=$(date -d "${INPUT_DATE}" +%F) || { echo "::error::invalid date input: ${INPUT_DATE}"; exit 1; }
          else
            TODAY=$(TZ=Asia/Tokyo date +%F)
          fi
          echo "TODAY=${TODAY}" >> "$GITHUB_ENV"
          echo "REQUESTED_JOB=${INPUT_JOB:-all}" >> "$GITHUB_ENV"
          echo "FORCE=${INPUT_FORCE:-false}" >> "$GITHUB_ENV"
          echo "TODAY=${TODAY}"

      # 日次は JST 火〜土のみ。判定は TODAY の曜日（月=1...日=7 → 火..土 = 2..6）。
      - name: Guard for Tue-Sat (JST)
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "::notice::force=true のためガードを無視します。"
            echo "skip=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$REQUESTED_JOB" != "all" ] && [ "$REQUESTED_JOB" != "daily" ]; then
            echo "::notice::job=${REQUESTED_JOB} のため daily をスキップします。"
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          DOW=$(TZ=Asia/Tokyo date -d "$TODAY" +%u)
          if [ "$DOW" -ge 2 ] && [ "$DOW" -le 6 ]; then
            echo "skip=false" >> "$GITHUB_ENV"
          else
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Setup Node.js
        if: ${{ env.skip != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install DeepSeek Harness (dsh)
        if: ${{ env.skip != 'true' }}
        run: |
          npm install -g @deepseek-ai/dsh@latest
          dsh --version
          echo "DeepSeek Harness (dsh) installed successfully."

      - name: Setup Python & dependencies
        if: ${{ env.skip != 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas beautifulsoup4 curl_cffi requests

      - name: Run indicator fetcher
        if: ${{ env.skip != 'true' }}
        run: |
          python fetch_indicators.py
          echo "--- generated market_summary.md ---"
          cat market_summary.md

      - name: Prepare prompt with today's date & fetched indicators
        if: ${{ env.skip != 'true' }}
        run: |
          mkdir -p _posts
          sed -e "s/yyyy-MM-dd/${TODAY}/g" \
              -e "s|\${GITHUB_WORKSPACE}|${GITHUB_WORKSPACE}|g" \
              prompt.md > generated-prompt.md
          printf '\n\n【参照用：当日に自動取得した市場指標データ（必ずこの数値を使用すること）】\n' >> generated-prompt.md
          cat market_summary.md >> generated-prompt.md
          echo "generated-prompt.md を作成しました（指標データ内包）。"

      - name: Run dsh Agent
        if: ${{ env.skip != 'true' }}
        env:
          TODAY: ${{ env.TODAY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSH_PERMISSION_MODE: danger-full-access
        run: |
          cp generated-prompt.md run-prompt.md
          timeout 900 dsh --profile headless - < run-prompt.md 2>agent-error.log || {
              echo "Error: dsh agent 実行に失敗しました。" >&2
              cat agent-error.log >&2
              rm -f generated-prompt.md run-prompt.md agent-error.log
              exit 1
            }
          rm -f agent-error.log

      - name: Commit and Push Generated Blog
        if: ${{ env.skip != 'true' }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          # エージェントが作成/再作成したファイルをすべてステージしてコミット。
          # 既存ファイルの再生成・複数ファイル生成の両方に対応。
          git add -A
          git commit -m "docs: auto-generate news digest (${TODAY}) by dsh" || echo "Nothing to commit (already committed or no change)."
          git push || echo "Nothing to push."

  # ============ 週次ブログ（毎週土曜 JST = UTC 金曜 22:00） ============
  weekly:
    name: Weekly Market Review
    runs-on: ubuntu-latest
    environment: key
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare today's date (JST)
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_JOB: ${{ inputs.job }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          if [ -n "${INPUT_DATE}" ]; then
            TODAY=$(date -d "${INPUT_DATE}" +%F) || { echo "::error::invalid date input: ${INPUT_DATE}"; exit 1; }
          else
            TODAY=$(TZ=Asia/Tokyo date +%F)
          fi
          echo "TODAY=${TODAY}" >> "$GITHUB_ENV"
          echo "REQUESTED_JOB=${INPUT_JOB:-all}" >> "$GITHUB_ENV"
          echo "FORCE=${INPUT_FORCE:-false}" >> "$GITHUB_ENV"
          echo "TODAY=${TODAY}"

      # 週次は JST 土曜（曜日=6）のみ。それ以外はスキップ。
      - name: Guard for Saturday (JST)
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "::notice::force=true のためガードを無視します。"
            echo "skip=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$REQUESTED_JOB" != "all" ] && [ "$REQUESTED_JOB" != "weekly" ]; then
            echo "::notice::job=${REQUESTED_JOB} のため weekly をスキップします。"
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          DOW=$(TZ=Asia/Tokyo date -d "$TODAY" +%u)
          if [ "$DOW" -eq 6 ]; then
            echo "skip=false" >> "$GITHUB_ENV"
          else
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Setup Node.js
        if: ${{ env.skip != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install DeepSeek Harness (dsh)
        if: ${{ env.skip != 'true' }}
        run: |
          npm install -g @deepseek-ai/dsh@latest
          dsh --version
          echo "DeepSeek Harness (dsh) installed successfully."

      - name: Run dsh Agent
        if: ${{ env.skip != 'true' }}
        env:
          TODAY: ${{ env.TODAY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSH_PERMISSION_MODE: danger-full-access
        run: |
          mkdir -p _posts
          sed "s/yyyy-MM-dd/${TODAY}/g" prompt-weekly.md > generated-prompt.md
          timeout 900 dsh --profile headless - < generated-prompt.md 2>agent-error.log || {
              echo "Error: dsh weekly agent 実行に失敗しました。" >&2
              cat agent-error.log >&2
              rm -f generated-prompt.md agent-error.log
              exit 1
            }
          rm -f agent-error.log

      - name: Commit and Push Weekly Review
        if: ${{ env.skip != 'true' }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          # エージェントが作成/再作成したファイルをすべてステージしてコミット。
          git add -A
          git commit -m "docs: auto-generate weekly review (${TODAY}) by dsh" || echo "Nothing to commit (already committed or no change)."
          git push || echo "Nothing to push."

  # ============ 月次ブログ（毎月1日 JST） ============
  monthly:
    name: Monthly Market Review
    runs-on: ubuntu-latest
    environment: key
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare today's date (JST)
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_JOB: ${{ inputs.job }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          if [ -n "${INPUT_DATE}" ]; then
            TODAY=$(date -d "${INPUT_DATE}" +%F) || { echo "::error::invalid date input: ${INPUT_DATE}"; exit 1; }
          else
            TODAY=$(TZ=Asia/Tokyo date +%F)
          fi
          echo "TODAY=${TODAY}" >> "$GITHUB_ENV"
          echo "REQUESTED_JOB=${INPUT_JOB:-all}" >> "$GITHUB_ENV"
          echo "FORCE=${INPUT_FORCE:-false}" >> "$GITHUB_ENV"
          echo "TODAY=${TODAY}"

      # 月次は毎月1日（JST）のみ。判定は「TODAY の日 = 01」。
      # それ以外の日はセットアップごとスキップしてリソースを無駄にしない。
      - name: Guard for 1st of month (JST)
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "::notice::force=true のためガードを無視します。"
            echo "skip=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$REQUESTED_JOB" != "all" ] && [ "$REQUESTED_JOB" != "monthly" ]; then
            echo "::notice::job=${REQUESTED_JOB} のため monthly をスキップします。"
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          DAY=$(TZ=Asia/Tokyo date -d "$TODAY" +%d)
          if [ "$DAY" = "01" ]; then
            echo "skip=false" >> "$GITHUB_ENV"
          else
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Setup Node.js
        if: ${{ env.skip != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install DeepSeek Harness (dsh)
        if: ${{ env.skip != 'true' }}
        run: |
          npm install -g @deepseek-ai/dsh@latest
          dsh --version
          echo "DeepSeek Harness (dsh) installed successfully."

      - name: Run dsh Agent
        if: ${{ env.skip != 'true' }}
        env:
          TODAY: ${{ env.TODAY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSH_PERMISSION_MODE: danger-full-access
        run: |
          mkdir -p _posts
          sed "s/yyyy-MM-dd/${TODAY}/g" prompt-monthly.md > generated-prompt.md
          timeout 1200 dsh --profile headless - < generated-prompt.md 2>agent-error.log || {
              echo "Error: dsh monthly agent 実行に失敗しました。" >&2
              cat agent-error.log >&2
              rm -f generated-prompt.md agent-error.log
              exit 1
            }
          rm -f agent-error.log

      - name: Commit and Push Monthly Review
        if: ${{ env.skip != 'true' }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          # エージェントが作成/再作成したファイルをすべてステージしてコミット。
          git add -A
          git commit -m "docs: auto-generate monthly review (${TODAY}) by dsh" || echo "Nothing to commit (already committed or no change)."
          git push || echo "Nothing to push."
